name: Build Fishhook Dylib
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Manually
        run: |
          rm -rf "$GITHUB_WORKSPACE"/*
          git clone "https://github.com/${{ github.repository }}.git" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git checkout "${{ github.sha }}"

      - name: Setup Theos
        run: |
          brew install make ldid
          git clone --depth 1 -b jev/arm64e https://github.com/jevinskie/fishhook SSLKillSwitch/fishhook
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          export THEOS=$HOME/theos
          $HOME/theos/bin/update-theos

      - name: Build Fishhook Dylib
        run: |
          make FISHHOOK=1 FINALPACKAGE=1
          mkdir output
          cp .theos/obj/SSLKillSwitch2.dylib output/

      - name: Build config helper
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib \
            -framework Foundation -framework Security \
            -o app_config.dylib app_config.m \
            -miphoneos-version-min=15.0
          cp app_config.dylib output/

      - name: Publish config helper to repo
        run: |
          mkdir -p artifacts
          cp output/app_config.dylib artifacts/app_config.dylib
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add artifacts/app_config.dylib
          git commit -m "ci: add built app_config.dylib [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSLKillSwitch2-fishhook
          path: |
            output/SSLKillSwitch2.dylib
            output/app_config.dylib
