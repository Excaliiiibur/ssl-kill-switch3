name: Build Fishhook Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install make ldid
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          export THEOS=$HOME/theos
          $HOME/theos/bin/update-theos

      - name: Build Fishhook Dylib
        run: |
          make FISHHOOK=1 FINALPACKAGE=1
          mkdir output
          cp .theos/obj/SSLKillSwitch2.dylib output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSLKillSwitch2-fishhook
          path: output/SSLKillSwitch2.dylib
